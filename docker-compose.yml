services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: pw, POSTGRES_DB: shop }
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d shop"], interval: 2s, retries: 30 }
  redis:
    image: redis:7
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 20 }
  order-service-1: &order
    build: ./app
    command: python order_service.py
    restart: unless-stopped
    environment: &env
      DATABASE_URL: postgresql://postgres:pw@postgres:5432/shop
      REDIS_URL: redis://redis:6379/0
      MODE: ${MODE:-proposed}
      DROP_RESPONSE_PROB: ${DROP_RESPONSE_PROB:-0}
      RELAY_CRASH_PROB: ${RELAY_CRASH_PROB:-0}
      WORKER_NO_ACK_PROB: ${WORKER_NO_ACK_PROB:-0}
    depends_on: &deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  order-service-2:
    <<: *order
  gateway:
    build: ./app
    command: python gateway.py
    restart: unless-stopped
    ports: ["8080:8000"]
    environment:
      MODE: ${MODE:-proposed}
      BACKENDS: http://order-service-1:8000,http://order-service-2:8000
    depends_on: [order-service-1, order-service-2]
  relay:
    build: ./app
    command: python relay.py
    environment: *env
    depends_on: *deps
    restart: unless-stopped
  payment-worker:
    build: ./app
    command: python payment_worker.py
    environment: *env
    depends_on: *deps
    restart: unless-stopped
    deploy: { replicas: 2 }
  loadtest:
    build: ./app
    command: python loadtest.py
    profiles: ["tools"]
    environment:
      <<: *env
      ORDER_URL: http://gateway:8000
      CRASH_MIDWAY: ${CRASH_MIDWAY:-0}
    depends_on: [gateway, relay, payment-worker]
